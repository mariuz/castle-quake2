<!--
  Inserted into the web page by CastleEngineManifest.xml (<web html_contents>).

  Caps the drawing resolution: the page template sizes the canvas to the
  screen's real pixels, which on a phone (device pixel ratio 3) means about
  9 times the pixels of the CSS size. Here the canvas's width / height
  setters are wrapped, so whatever size the template asks for is drawn at
  most at a pixel ratio of 1.5 and 1920 x 1080 pixels in all; the browser
  stretches the picture to the canvas. "?scale=0.5" in the address draws at
  that fraction on top (a render scale for slow devices), "?scale=1" with
  "?fullres=1" turns the caps off.
-->
<script>
(function () {
  const canvas = document.getElementById("castle-canvas");
  if (!canvas) return;
  const params = new URLSearchParams(window.location.search);
  const userScale = Math.min(1, Math.max(0.25, parseFloat(params.get("scale")) || 1));
  const fullRes = params.get("fullres") === "1";
  const maxRatio = 1.5;
  const maxPixels = 1920 * 1080;
  const proto = HTMLCanvasElement.prototype;
  const widthProp = Object.getOwnPropertyDescriptor(proto, "width");
  const heightProp = Object.getOwnPropertyDescriptor(proto, "height");
  let wantedWidth = 0, wantedHeight = 0;

  function apply() {
    let scale = userScale;
    if (!fullRes) {
      // The ratio of what the template asked for to the canvas's CSS size
      // (devicePixelRatio alone is wrong when the browser already gave CSS
      // pixels, e.g. without devicePixelContentBoxSize)
      const ratio = canvas.clientWidth > 0 ? wantedWidth / canvas.clientWidth : (window.devicePixelRatio || 1);
      if (ratio > maxRatio) scale *= maxRatio / ratio;
      const pixels = wantedWidth * wantedHeight * scale * scale;
      if (pixels > maxPixels) scale *= Math.sqrt(maxPixels / pixels);
    }
    const w = Math.max(1, Math.round(wantedWidth * scale));
    const h = Math.max(1, Math.round(wantedHeight * scale));
    if (widthProp.get.call(canvas) !== w) widthProp.set.call(canvas, w);
    if (heightProp.get.call(canvas) !== h) heightProp.set.call(canvas, h);
    console.log(`Castle Quake 2: drawing at ${w}x${h} for a ${wantedWidth}x${wantedHeight} canvas (scale ${scale.toFixed(2)})`);
  }

  Object.defineProperty(canvas, "width", {
    get() { return widthProp.get.call(canvas); },
    set(v) { wantedWidth = v; if (wantedHeight > 0) apply(); else widthProp.set.call(canvas, v); }
  });
  Object.defineProperty(canvas, "height", {
    get() { return heightProp.get.call(canvas); },
    set(v) { wantedHeight = v; if (wantedWidth > 0) apply(); else heightProp.set.call(canvas, v); }
  });
})();
</script>
<!--
  Packets between pages of this browser (pages/duel.html: two games in
  iframes, one hosting, one joining; QuakeNetLink.TNetWebLink). The game
  calls document.CastleNetOpen(name) once ('' = make up a name; returns
  the page's name), CastleNetSend(to, hex) and CastleNetReceive() ('' or
  "<from>\n<hex>"). Every page of this site hears the same
  BroadcastChannel; a page takes only what is sent to its name. Opening
  announces the name ({hello: name}), so the duel page knows a host is up.
-->
<script>
(function () {
  if (typeof BroadcastChannel === "undefined") return;
  let channel = null;
  let myName = "";
  const inbox = [];
  document.CastleNetOpen = function (name) {
    myName = name || ("page-" + Math.random().toString(36).slice(2, 10));
    if (!channel) {
      channel = new BroadcastChannel("castle-quake2-net");
      channel.onmessage = function (e) {
        const m = e.data;
        if (m && m.to === myName && typeof m.data === "string")
          inbox.push(m.from + "\n" + m.data);
      };
    }
    channel.postMessage({ hello: myName });
    console.log("Castle Quake 2: net page " + myName);
    return myName;
  };
  document.CastleNetSend = function (to, hex) {
    if (!channel) return false;
    channel.postMessage({ from: myName, to: to, data: hex });
    return true;
  };
  document.CastleNetReceive = function () {
    return inbox.length > 0 ? inbox.shift() : "";
  };
})();
</script>
