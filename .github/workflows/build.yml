# Native builds (Windows x86_64, Linux x86_64) using the Castle Game Engine
# Docker image, which bundles FPC with cross-compilers and the CGE build tool.
#
# - On every push / pull request: build and keep the packages as workflow artifacts.
# - On a tag like v0.1.0, or on main when the manifest version is not tagged
#   yet: also create the GitHub Release (and tag) with the packages.
#
# See https://castle-engine.io/github_actions and https://castle-engine.io/docker

name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: Package Windows and Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: kambi/castle-engine-cloud-builds-tools:cge-unstable
    steps:
      - uses: actions/checkout@v4

      - name: Show versions
        run: |
          castle-engine --version
          fpc -iV

      - name: Package Windows (x86_64)
        run: castle-engine package --os=win64 --cpu=x86_64 --mode=release --verbose

      - name: Package Linux (x86_64)
        run: castle-engine package --os=linux --cpu=x86_64 --mode=release --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake2-windows
          path: "*-win64-x86_64.zip"
          if-no-files-found: error

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake2-linux
          path: "*-linux-x86_64.tar.gz"
          if-no-files-found: error

  build-android:
    name: Package Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The image has the Android SDK / NDK and FPC cross-compilers for Android
    container: kambi/castle-engine-cloud-builds-tools:cge-unstable
    steps:
      - uses: actions/checkout@v4

      - name: Package Android (arm, aarch64)
        # Without AndroidSigningProperties.txt the release APK is signed
        # with a debug key: fine for sideloading and testing
        run: castle-engine package --target=android --mode=release --verbose

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake2-android
          path: "*.apk"
          if-no-files-found: error

  autotest:
    name: Autotest (Linux, Mesa software OpenGL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: kambi/castle-engine-cloud-builds-tools:cge-unstable
    steps:
      - uses: actions/checkout@v4

      - name: Install virtual display and Mesa
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1

      - name: Parser unit tests
        working-directory: tests
        run: |
          castle-engine compile --os=linux --cpu=x86_64 --mode=debug
          ./castle-quake2-tests

      - name: Compile (Linux)
        run: castle-engine compile --os=linux --cpu=x86_64 --mode=release

      - name: Run autotest scripts
        run: |
          set -eu
          mkdir -p test_output
          run_test() {
            map="$1"; demo="$2"
            echo "::group::autotest $map"
            # On Linux the CGE log goes to stdout: capture it next to the screenshots
            status=0
            timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest "$map" "test_output/$map" --demo "$demo" > "test_output/$map.log" 2>&1 || status=$?
            tail -n 40 "test_output/$map.log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::autotest $map exited with $status"; exit 1
            fi
            if grep -q "shader not compiled" "test_output/$map.log"; then
              echo "::error::GLSL shader compile error in autotest $map"; exit 1
            fi
            if grep -q "Exception" "test_output/$map.log"; then
              echo "::error::Exception in autotest $map"; exit 1
            fi
          }
          run_test demo1 "W:2,S,K,N:3,C:9,W:0.5,X,W:0.3,S,R:14,C:7,W:0.5,X,W:0.5,S,O:kill,W:3.5,S,Q"
          run_test demo2 "W:2,S,GO:1 0 1,W:1.1,J,W:0.3,S,F,W:0.3,S,F,W:1,Q"
          run_test demo3 "W:2,S,O:lightstyle 6 z,W:0.5,S,O:map demo1,W:1,S,Q"
          # Menu: Single Player -> Hard starts the first map; Options -> field of view
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo2 test_output/menu --demo "O:notarget,W:1,B:escape,B:enter,B:down,B:down,B:enter,W:1,B:escape,B:down,B:down,B:enter,B:down,B:down,B:down,B:down,B:right,B:right,W:0.2,S,B:escape,B:escape,W:0.5,S,Q" > test_output/menu.log 2>&1
          grep -q "Spawned 35 pickups, 33 monsters" test_output/menu.log && ! grep -q Exception test_output/menu.log || { echo "::error::Hard skill new game from the menu"; exit 1; }
          # Virtual gamepad: left stick walks, right stick turns, right trigger fires, Menu opens the menu
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/gamepad --demo "O:notarget,W:1.5,K,C:2,W:0.5,GP:0 1 0.6 0 0 1,W:1.2,GP:,W:0.3,V,GB:menu,W:0.3,S,Q" > test_output/gamepad.log 2>&1
          ! grep -q "Demo: Player at 128 46 320 " test_output/gamepad.log && grep -q "Demo: Player at" test_output/gamepad.log && ! grep -q Exception test_output/gamepad.log || { echo "::error::Virtual gamepad did not move the player"; exit 1; }
          # Touch controls (--touch, simulated fingers): the move stick walks, FIRE shoots
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --touch --autotest demo1 test_output/touch --demo "O:notarget,W:1.5,K,C:2,W:0.8,TD:0.2 0.3 0,TM:0.2 0.45 0,W:0.8,TU:0,TD:0.88 0.14 2,W:0.6,TU:2,W:0.2,V,S,Q" > test_output/touch.log 2>&1
          ! grep -q "Demo: Player at 128 46.03125 320 " test_output/touch.log && grep -q "ammo shells 99 " test_output/touch.log && ! grep -q Exception test_output/touch.log || { echo "::error::Touch controls did not move / fire"; exit 1; }
          # Phone screen (2400x1080, touch): tap MENU, then tap the Options row twice (interface scaled for touch)
          timeout 600 xvfb-run -a -s "-screen 0 2400x1080x24" ./castle-quake2 --geometry 2400x1080 --touch --autotest demo1 test_output/phone --demo "O:notarget,W:1.5,TD:0.96 0.93 0,TU:0,W:0.3,TD:0.5 0.63 1,TU:1,TD:0.5 0.63 1,TU:1,W:0.3,S,Q" > test_output/phone.log 2>&1
          grep -q "Menu: Page Options" test_output/phone.log && ! grep -q Exception test_output/phone.log || { echo "::error::Tapping the menu on a phone-sized screen did not open Options"; exit 1; }
          # Full-game entities spawned with the "spawn" console command: target_earthquake shoves, target_blaster hits
          # (100 -> 85), trigger_gravity, misc_blackhole goes away, misc_viper flies, misc_viper_bomb explodes,
          # target_spawner, func_killbox telefrags
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/ents --demo 'O:notarget,W:1.5,A:90,W:0.2,O:spawn target_earthquake targetname q count 1.5,E:q,W:0.4,V,W:1.5,V,G:128 -320 46,W:0.3,O:spawn target_blaster targetname b angle 270 origin "128 -200 40",E:b,W:0.6,V,Y,O:spawn trigger_gravity gravity 0.3 origin "128 -320 22" mins "-64 -64 -32" maxs "64 64 64",W:0.3,V,O:spawn misc_eastertank angle 270 origin "128 -150 10",O:spawn misc_blackhole targetname bh origin "40 -150 60",W:0.5,S,E:bh,O:spawn path_corner targetname p1 origin "128 400 200",O:spawn misc_viper targetname v target p1 speed 300 origin "128 -600 200",O:spawn misc_viper_bomb targetname bomb dmg 30 origin "128 -400 200",E:v,W:0.5,E:bomb,W:0.2,S,W:2,V,O:spawn target_spawner targetname sp target misc_explobox origin "200 -250 0",E:sp,Y,O:spawn func_killbox targetname kb origin "128 -320 22" mins "-32 -32 -32" maxs "32 32 32",E:kb,W:0.5,V,Q' > test_output/ents.log 2>&1
          L=test_output/ents.log
          grep -q "earthquakes: 1," $L && grep -q "health 85$" $L && grep -q "player gravity 0.30" $L && grep -q "misc_blackhole health 0 destroyed True" $L && grep -q "misc_viper health 0 destroyed False flying True" $L && grep -q "misc_viper_bomb health 0 destroyed True" $L && grep -q "target_spawner made a misc_explobox" $L && grep -q "health -9" $L && ! grep -q Exception $L || { echo "::error::Spawned full-game entities misbehaved (see ents.log)"; exit 1; }
          # Gibs (ThrowGib): a railgun shot gibs a soldier into its 5 pieces, a flyer explodes (BecomeExplosion1)
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/gibs --demo 'O:notarget,W:1.5,A:90,Y,K,C:9,W:1.2,O:spawn monster_soldier origin "128 -150 24" angle 270,W:0.2,X,W:2,V,O:spawn monster_flyer origin "128 -200 46" angle 270,W:0.2,X,W:1,V,Q' > test_output/gibs.log 2>&1
          grep -q "monster_soldier gibbed" test_output/gibs.log && grep -q "gibs: 5$" test_output/gibs.log && grep -q "monster_flyer gibbed" test_output/gibs.log && ! grep -q Exception test_output/gibs.log || { echo "::error::Gibs misbehaved (see gibs.log)"; exit 1; }
          # Movers push entities: a corpse left under demo1's auto door is gibbed when it closes (SV_Push / door_blocked)
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/doorcorpse --demo "O:notarget,W:1,N:3,W:0.2,X,W:0.6,X,W:0.6,X,W:1.5,G:-1180 1632 -1.97,W:1.5,MV:3 -1112 1632 -23.9,G:-1300 1632 -1.97,W:7,V,Q" > test_output/doorcorpse.log 2>&1
          grep -E "Demo: Monster 3 " test_output/doorcorpse.log | grep -q "health -10[0-9][0-9]" && ! grep -q Exception test_output/doorcorpse.log || { echo "::error::The door did not crush the corpse"; exit 1; }
          # record console command: a scripted run records itself, the saved script
          # replays to the same place (within 8 units)
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/record --demo "O:notarget,W:1,O:record ci,W:0.5,GO:1 0 1.5,W:0.4,T:45,W:1.2,J,W:0.3,GO:0 1 0.8,P:10,W:1,C:1,W:0.3,X,W:0.5,O:stop,V,Q" > test_output/record.log 2>&1
          rec_file=$(grep -o "demo @[^ ]*" test_output/record.log | head -1 | cut -c7-)
          test -s "$rec_file" || { echo "::error::record did not save a script"; exit 1; }
          cp "$rec_file" test_output/record-ci.txt
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/replay --demo "@$rec_file" > test_output/replay.log 2>&1
          grep "Replay drift" test_output/replay.log
          pos() { grep -o "Demo: Player at [-0-9.e]* [-0-9.e]* [-0-9.e]*" "$1" | tail -1 | cut -d' ' -f4-6; }
          echo "recorded $(pos test_output/record.log), replayed $(pos test_output/replay.log)"
          echo "$(pos test_output/record.log) $(pos test_output/replay.log)" | awk '{ d = sqrt(($1-$4)^2 + ($2-$5)^2 + ($3-$6)^2); print "distance " d; exit !(d < 8) }' && ! grep -q Exception test_output/replay.log || { echo "::error::The replay of a recording ended elsewhere"; exit 1; }
          # Map compatibility report of the demo PAK (docs/map-report-demo.md):
          # every entity class of the demo maps must stay handled
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --map-report test_output/map-report.md > test_output/map-report.log 2>&1
          cat test_output/map-report.md
          grep -A2 "## Unsupported classnames" test_output/map-report.md | grep -q "None." || { echo "::error::Demo maps have unsupported entity classes (see map-report.md)"; exit 1; }
          ls -l test_output
          test "$(ls test_output/*.png | wc -l)" -ge 9

      - name: Compare screenshots with references
        run: |
          set -eu
          # One early screenshot per map, compared (as 64x36 block averages) with
          # tests/reference/<map>.png. A missing reference is created and uploaded
          # with the artifacts, to be committed.
          mkdir -p test_output/compare tests/reference
          status=0
          for map in demo1 demo2 demo3; do
            timeout 300 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest "$map" "test_output/compare/$map" --demo "O:notarget,W:2,S,Q" > "test_output/compare/$map.log" 2>&1
            (cd tests && ./castle-quake2-tests --compare "reference/$map.png" "../test_output/compare/${map}_1.png" "../test_output/compare/${map}_diff.png") || status=1
          done
          # PVS culling must not hide anything visible: the same views with and
          # without culling ("novis") must match
          # (after demo1's opening explosions, whose lights would differ in time)
          views="I:0,W:0.3,S,T:120,W:0.2,S,T:120,W:0.2,S,I:12,W:0.3,S,T:120,W:0.2,S,I:24,W:0.3,S,T:180,W:0.2,S"
          for mode in vis novis; do
            pre="O:notarget,O:god"; [ "$mode" = novis ] && pre="$pre,O:novis"
            timeout 300 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 "test_output/compare/pvs_$mode" --demo "$pre,W:4,$views,Q" > "test_output/compare/pvs_$mode.log" 2>&1
          done
          for k in 1 2 3 4 5 6 7; do
            (cd tests && ./castle-quake2-tests --compare "../test_output/compare/pvs_novis_$k.png" "../test_output/compare/pvs_vis_$k.png" "../test_output/compare/pvs_diff_$k.png" 2) || status=1
          done
          # Sky rotation (worldspawn skyrotate, here set with the sky command):
          # two shots of the sky one second apart must differ
          timeout 300 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/compare/sky --demo "O:notarget,W:1,O:noclip,G:-1248 16 300,A:90,P:40,O:novis,O:sky unit1_ 90 0 0 1,W:0.5,S,W:1,S,Q" > test_output/compare/sky.log 2>&1
          if (cd tests && ./castle-quake2-tests --compare "../test_output/compare/sky_1.png" "../test_output/compare/sky_2.png" "../test_output/compare/sky_diff.png"); then
            echo "::error::The sky did not rotate"; status=1
          fi
          cp -r tests/reference test_output/compare/reference
          if [ "$status" -ne 0 ]; then
            echo "::error::Screenshots differ from tests/reference (see test_output/compare/*_diff.png in the artifact)"
          fi
          exit $status

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-screenshots
          path: test_output/
          if-no-files-found: warn

  release:
    name: GitHub Release
    # A pushed tag v*, or a push to main whose CastleEngineManifest.xml
    # version has no tag yet (then this job creates the tag v<version>)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [build-native, build-android, autotest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Which release
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(sed -n 's/.*<version value="\([^"]*\)".*/\1/p' CastleEngineManifest.xml | head -1)"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag is already released"
              tag=""
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release: ${tag:-none}"
      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.tag != ''
        with:
          merge-multiple: true
          path: packages
      - name: Release notes from docs/CHANGELOG.md
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ls -l packages
          # The section of this tag ("## v0.3.0 ..." up to the next "## ")
          awk -v tag="$TAG" '/^## / { on = index($0, "## " tag) == 1; next } on' docs/CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See [docs/CHANGELOG.md](docs/CHANGELOG.md)." > release-notes.md
          cat release-notes.md
      - name: Create release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Castle Quake 2 ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          files: |
            packages/*.zip
            packages/*.tar.gz
            packages/*.apk
          generate_release_notes: true
