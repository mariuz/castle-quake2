# Native builds (Windows x86_64, Linux x86_64) using the Castle Game Engine
# Docker image, which bundles FPC with cross-compilers and the CGE build tool.
#
# - On every push / pull request: build and keep the packages as workflow artifacts.
# - On a tag like v0.1.0, or on main when the manifest version is not tagged
#   yet: also create the GitHub Release (and tag) with the packages.
#
# See https://castle-engine.io/github_actions and https://castle-engine.io/docker

name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: Package Windows and Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: kambi/castle-engine-cloud-builds-tools:cge-unstable
    steps:
      - uses: actions/checkout@v4

      - name: Show versions
        run: |
          castle-engine --version
          fpc -iV

      - name: Package Windows (x86_64)
        run: castle-engine package --os=win64 --cpu=x86_64 --mode=release --verbose

      - name: Package Linux (x86_64)
        run: castle-engine package --os=linux --cpu=x86_64 --mode=release --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake2-windows
          path: "*-win64-x86_64.zip"
          if-no-files-found: error

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake2-linux
          path: "*-linux-x86_64.tar.gz"
          if-no-files-found: error

  build-android:
    name: Package Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The image has the Android SDK / NDK and FPC cross-compilers for Android
    container: kambi/castle-engine-cloud-builds-tools:cge-unstable
    steps:
      - uses: actions/checkout@v4

      - name: Package Android (arm, aarch64)
        # Without AndroidSigningProperties.txt the release APK is signed
        # with a debug key: fine for sideloading and testing
        run: castle-engine package --target=android --mode=release --verbose

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake2-android
          path: "*.apk"
          if-no-files-found: error

  build-editor:
    name: CGE editor with custom components
    # Builds the CGE editor with editor_units (Lazarus), like "Project ->
    # Restart Editor (With Custom Components)": catches units the editor
    # can't use (e.g. CastleWindow) and errors in the property editors
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: kambi/castle-engine-cloud-builds-tools:cge-unstable
    steps:
      - uses: actions/checkout@v4

      - name: Build the custom editor
        run: |
          lazbuild --version
          castle-engine editor-rebuild-if-needed
          ls -l castle-engine-output/editor/castle-editor-new

  autotest:
    name: Autotest (Linux, Mesa software OpenGL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: kambi/castle-engine-cloud-builds-tools:cge-unstable
    steps:
      - uses: actions/checkout@v4

      - name: Install virtual display and Mesa
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libopenal1

      - name: Parser unit tests
        working-directory: tests
        run: |
          castle-engine compile --os=linux --cpu=x86_64 --mode=debug
          ./castle-quake2-tests

      - name: Compile (Linux)
        run: castle-engine compile --os=linux --cpu=x86_64 --mode=release

      - name: Run autotest scripts
        run: |
          set -eu
          mkdir -p test_output
          run_test() {
            map="$1"; demo="$2"
            echo "::group::autotest $map"
            # On Linux the CGE log goes to stdout: capture it next to the screenshots
            status=0
            timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest "$map" "test_output/$map" --demo "$demo" > "test_output/$map.log" 2>&1 || status=$?
            tail -n 40 "test_output/$map.log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::autotest $map exited with $status"; exit 1
            fi
            if grep -q "shader not compiled" "test_output/$map.log"; then
              echo "::error::GLSL shader compile error in autotest $map"; exit 1
            fi
            if grep -q "Exception" "test_output/$map.log"; then
              echo "::error::Exception in autotest $map"; exit 1
            fi
          }
          run_test demo1 "W:2,S,K,N:3,C:9,W:0.5,X,W:0.3,S,R:14,C:7,W:0.5,X,W:0.5,S,O:kill,W:3.5,S,Q"
          run_test demo2 "W:2,S,GO:1 0 1,W:1.1,J,W:0.3,S,F,W:0.3,S,F,W:1,Q"
          run_test demo3 "W:2,S,O:lightstyle 6 z,W:0.5,S,O:map demo1,W:1,S,Q"
          # Menu: Single Player -> Hard starts the first map; Options -> field of view
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo2 test_output/menu --demo "O:notarget,W:1,B:escape,B:enter,B:down,B:down,B:enter,W:1,B:escape,B:down,B:down,B:enter,B:down,B:down,B:down,B:down,B:right,B:right,W:0.2,S,B:escape,B:escape,W:0.5,S,Q" > test_output/menu.log 2>&1
          grep -q "Spawned 35 pickups, 33 monsters" test_output/menu.log && ! grep -q Exception test_output/menu.log || { echo "::error::Hard skill new game from the menu"; exit 1; }
          # Virtual gamepad: left stick walks, right stick turns, right trigger fires, Menu opens the menu
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/gamepad --demo "O:notarget,W:1.5,K,C:2,W:0.5,GP:0 1 0.6 0 0 1,W:1.2,GP:,W:0.3,V,GB:menu,W:0.3,S,Q" > test_output/gamepad.log 2>&1
          ! grep -q "Demo: Player at 128 46 320 " test_output/gamepad.log && grep -q "Demo: Player at" test_output/gamepad.log && ! grep -q Exception test_output/gamepad.log || { echo "::error::Virtual gamepad did not move the player"; exit 1; }
          # Gamepad rebinding: Options -> Controls -> Gamepad Buttons, bind Jump to Y with the pad; then A (grenades) selects hand grenades, holding Y jumps
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/pad --demo "O:notarget,W:1.5,K,B:escape,B:down,B:down,B:enter,B:down,B:down,B:down,B:down,B:down,B:down,B:down,B:down,B:down,B:down,B:down,B:down,B:enter,B:down,B:down,B:down,B:down,B:down,B:down,B:down,B:down,B:down,B:down,B:enter,GB:south,GB:north,W:0.2,S,B:escape,B:escape,B:escape,B:escape,O:padbind,GB:south,W:1.5,V,GH:north,W:0.3,S,GH:north,Q" > test_output/pad.log 2>&1
          grep -q "Menu: Gamepad Jump: north" test_output/pad.log && grep -q "Gamepad: grenade: south" test_output/pad.log && grep -q "Gun: weapon 11 " test_output/pad.log && grep "pad_2.png" test_output/pad.log | grep -qv "camera 128 46.03125 320" && ! grep -q Exception test_output/pad.log || { echo "::error::Gamepad button rebinding"; exit 1; }
          # Touch controls (--touch, simulated fingers): the move stick walks, FIRE shoots
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --touch --autotest demo1 test_output/touch --demo "O:notarget,W:1.5,K,C:2,W:0.8,TD:0.2 0.3 0,TM:0.2 0.45 0,W:0.8,TU:0,TD:0.88 0.14 2,W:0.6,TU:2,W:0.2,V,S,Q" > test_output/touch.log 2>&1
          ! grep -q "Demo: Player at 128 46.03125 320 " test_output/touch.log && grep -q "ammo shells 99 " test_output/touch.log && ! grep -q Exception test_output/touch.log || { echo "::error::Touch controls did not move / fire"; exit 1; }
          # Phone screen (2400x1080, touch): tap MENU, then tap the Options row twice (interface scaled for touch)
          timeout 600 xvfb-run -a -s "-screen 0 2400x1080x24" ./castle-quake2 --geometry 2400x1080 --touch --autotest demo1 test_output/phone --demo "O:notarget,W:1.5,TD:0.96 0.93 0,TU:0,W:0.3,TD:0.5 0.63 1,TU:1,TD:0.5 0.63 1,TU:1,W:0.3,S,Q" > test_output/phone.log 2>&1
          grep -q "Menu: Page Options" test_output/phone.log && ! grep -q Exception test_output/phone.log || { echo "::error::Tapping the menu on a phone-sized screen did not open Options"; exit 1; }
          # Full-game entities spawned with the "spawn" console command: target_earthquake shoves, target_blaster hits
          # (100 -> 85), trigger_gravity, misc_blackhole goes away, misc_viper flies, misc_viper_bomb explodes,
          # target_spawner, func_killbox telefrags
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/ents --demo 'O:notarget,W:1.5,A:90,W:0.2,O:spawn target_earthquake targetname q count 1.5,E:q,W:0.4,V,W:1.5,V,G:128 -320 46,W:0.3,O:spawn target_blaster targetname b angle 270 origin "128 -200 40",E:b,W:0.6,V,Y,O:spawn trigger_gravity gravity 0.3 origin "128 -320 22" mins "-64 -64 -32" maxs "64 64 64",W:0.3,V,O:spawn misc_eastertank angle 270 origin "128 -150 10",O:spawn misc_blackhole targetname bh origin "40 -150 60",W:0.5,S,E:bh,O:spawn path_corner targetname p1 origin "128 1400 200",O:spawn misc_viper targetname v target p1 speed 300 origin "128 -600 200",O:spawn misc_viper_bomb targetname bomb dmg 30 origin "128 -400 200",E:v,W:0.5,E:bomb,W:0.2,S,W:2,V,O:spawn target_spawner targetname sp target misc_explobox origin "200 -250 0",E:sp,Y,O:spawn func_killbox targetname kb origin "128 -320 22" mins "-32 -32 -32" maxs "32 32 32",E:kb,W:0.5,V,Q' > test_output/ents.log 2>&1
          L=test_output/ents.log
          grep -q "earthquakes: 1," $L && grep -q "health 85$" $L && grep -q "player gravity 0.30" $L && grep -q "misc_blackhole health 0 destroyed True" $L && grep -q "misc_viper health 0 destroyed False flying True" $L && grep -q "misc_viper_bomb health 0 destroyed True" $L && grep -q "target_spawner made a misc_explobox" $L && grep -q "health -9" $L && ! grep -q Exception $L || { echo "::error::Spawned full-game entities misbehaved (see ents.log)"; exit 1; }
          # Gibs (ThrowGib): a railgun shot gibs a soldier into its 5 pieces, a flyer explodes (BecomeExplosion1)
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/gibs --demo 'O:notarget,W:1.5,A:90,Y,K,C:9,W:1.2,O:spawn monster_soldier origin "128 -150 24" angle 270,W:0.2,X,W:2,V,O:spawn monster_flyer origin "128 -200 46" angle 270,W:0.2,X,W:1,V,Q' > test_output/gibs.log 2>&1
          grep -q "monster_soldier gibbed" test_output/gibs.log && grep -q "gibs: 5$" test_output/gibs.log && grep -q "monster_flyer gibbed" test_output/gibs.log && ! grep -q Exception test_output/gibs.log || { echo "::error::Gibs misbehaved (see gibs.log)"; exit 1; }
          # The Reckoning's props (spawned; the demo has no models for them): the pulsing laser hurts
          # through the player and switches off, the rotating light switches on, the viper missile fires
          # once, the transport flies hidden until used, the welding sparks / amb4 run, the nuke removes
          # the monsters (god mode: the player lives)
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/xprops --demo 'O:notarget,W:1.5,G:128 -320 46,W:0.3,O:spawn target_mal_laser targetname ml angle 270 spawnflags 3 origin "128 -200 30",W:1,V,E:ml,Y,O:spawn rotating_light targetname rl spawnflags 3 origin "128 -250 60",E:rl,O:spawn info_notnull targetname vt origin "128 -600 40",O:spawn misc_viper_missile targetname vm target vt origin "128 -250 90",E:vm,W:0.05,V,E:vm,O:spawn path_corner targetname pc origin "128 1400 200",O:spawn misc_transport targetname tr target pc origin "128 -600 200",W:0.2,V,E:tr,O:spawn func_object_repair origin "128 -260 40",O:spawn misc_amb4,W:1.2,V,O:spawn misc_nuke targetname nk,E:nk,W:0.3,V,Q' > test_output/xprops.log 2>&1
          L=test_output/xprops.log
          grep -q "Laser 0 on True length [0-9]* target_mal_laser pulses" $L && grep -q "Laser 0 on False" $L && grep -q "player health [5-9][0-9] armor" $L && grep -q "rotating_light health 10 destroyed False flying False exists True light True" $L && [ "$(grep -c 'misc_viper_missile fired' $L)" = 1 ] && grep -q "misc_transport health 0 destroyed False flying True exists False" $L && grep -q "misc_transport health 0 destroyed False flying True exists True" $L && grep -q "misc_nuke: 21 monsters removed" $L && ! grep -q Exception $L || { echo "::error::The Reckoning's props misbehaved (see xprops.log)"; exit 1; }
          # The gekk (spawned in demo1's pool, the player on land): it swims, and leaves the water after him
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/gekk --demo 'W:1.5,Y,G:1088 380 -200,W:0.3,V,O:spawn monster_gekk origin "1088 720 -290" angle 270,W:0.5,O:hurt last 1,W:8,V,Q' > test_output/gekk.log 2>&1
          grep -q "monster_gekk swims at" test_output/gekk.log && grep -q "monster_gekk leaves the water" test_output/gekk.log && ! grep -q Exception test_output/gekk.log || { echo "::error::The gekk did not swim / leave the water (see gekk.log)"; exit 1; }
          # The fixbot welds a func_object_repair until it is repaired (its target fires), then revives a dead soldier
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/fixbot --demo 'O:notarget,W:1.5,G:128 -320 46,O:spawn func_object_repair targetname rep target fixed origin "128 -100 40",O:spawn target_explosion targetname fixed origin "128 -100 40",O:spawn monster_fixbot origin "128 -250 80" angle 90,W:12,V,O:spawn monster_soldier origin "60 -250 24" angle 90,W:0.3,O:hurt last 30,W:2,O:spawn monster_fixbot origin "60 -330 80" angle 90,W:6,V,Q' > test_output/fixbot.log 2>&1
          L=test_output/fixbot.log
          grep -q "monster_fixbot welds func_object_repair" $L && grep -q "monster_fixbot finished welding" $L && grep -q 'func_object_repair repaired: fires "fixed"' $L && grep -q "monster_fixbot goes to revive" $L && grep -q "monster_soldier revived" $L && ! grep -q Exception $L || { echo "::error::The fixbot did not weld / revive (see fixbot.log)"; exit 1; }
          # Fixbots placed to roam (spawnflags 4), land (16) and take off (8)
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/fixroam --demo 'O:notarget,W:1.5,G:128 -320 46,O:spawn monster_fixbot origin "128 -250 120" angle 90 spawnflags 4,W:10,V,O:spawn monster_fixbot origin "60 -330 140" angle 90 spawnflags 16,W:8,V,O:spawn monster_fixbot origin "128 -280 60" angle 90 spawnflags 8,W:6,V,Q' > test_output/fixroam.log 2>&1
          L=test_output/fixroam.log
          grep -q "monster_fixbot roams to" $L && grep -q "monster_fixbot landed at" $L && grep -q "monster_fixbot took off at" $L && ! grep -q Exception $L || { echo "::error::The fixbot did not roam / land / take off (see fixroam.log)"; exit 1; }
          # Ground Zero's targets: a soldier angered at a spot (target_anger), steam, target_killplayers
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/gzents --demo 'Y,W:1.5,G:128 -320 46,O:spawn info_notnull targetname rock origin "128 100 40",O:spawn monster_soldier targetname grp origin "128 -150 24" angle 90,O:spawn target_anger targetname ang target grp killtarget rock,O:spawn target_steam targetname st wait 2 count 32 speed 100 angle -1 origin "60 -300 30",W:0.5,E:ang,E:st,W:1,V,W:2,Y,O:spawn target_killplayers targetname kp,E:kp,W:0.5,V,Q' > test_output/gzents.log 2>&1
          L=test_output/gzents.log
          grep -q "monster_soldier angered at rock" $L && grep -q "monster_soldier attacks:" $L && grep -q "target_steam puffs for 2.0 s" $L && grep -q "target_killplayers: the player and" $L && grep -qE "Player (died|gibbed)" $L && ! grep -q Exception $L || { echo "::error::Ground Zero's targets misbehaved (see gzents.log)"; exit 1; }
          # Ground Zero's turrets (no models in the demo): one in the ceiling fires at the player, a wall unit comes out when used
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/gzturret --demo 'Y,W:1.5,G:128 -320 46,O:spawn monster_turret origin "128 -320 150" angle -2 spawnflags 8,O:spawn monster_turret targetname tw origin "160 -320 150" angle -2 spawnflags 136,W:0.5,E:tw,W:6,V,Q' > test_output/gzturret.log 2>&1
          L=test_output/gzturret.log
          grep -q "monster_turret comes out of the wall" $L && grep -qE "Monster shots: [1-9]" $L && ! grep -q Exception $L || { echo "::error::Ground Zero's turrets misbehaved (see gzturret.log)"; exit 1; }
          # Ground Zero's stalker (no model in the demo): hurt, it jumps up to the ceiling and drops; nearly dead, it plays dead and gets up when hit
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/gzstalker --demo 'O:notarget,W:1,G:128 -320 46,A:90,O:spawn monster_stalker,W:1,O:hurt last 12,W:3.1,O:hurt last 12,W:3.1,O:hurt last 12,W:3.1,O:hurt last 12,W:3.1,O:hurt last 12,W:3.1,O:hurt last 12,W:3.1,O:hurt last 12,W:3.1,O:hurt last 12,W:3.1,O:hurt last 12,W:3.1,O:hurt last 12,W:3.1,O:hurt last 105,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,O:hurt last 1,W:0.2,W:1.5,O:hurt last 1,W:1,V,Q' > test_output/gzstalker.log 2>&1
          L=test_output/gzstalker.log
          grep -q "monster_stalker jumps up to the ceiling" $L && grep -q "monster_stalker climbs back to the ceiling" $L && grep -q "monster_stalker plays dead" $L && grep -q "monster_stalker gets up" $L && ! grep -q Exception $L || { echo "::error::Ground Zero's stalker misbehaved (see gzstalker.log)"; exit 1; }
          # A blaster turret that lost the player shoots blind where he was last seen
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/gzblind --demo 'Y,W:1.5,G:128 -320 46,O:spawn monster_turret origin "128 -320 150" angle -2 spawnflags 8,W:3,G:-200 -320 46,W:9,V,Q' > test_output/gzblind.log 2>&1
          L=test_output/gzblind.log
          grep -q "monster_turret blind fires" $L && ! grep -q Exception $L || { echo "::error::Ground Zero's turret blind fire misbehaved (see gzblind.log)"; exit 1; }
          # Ground Zero's weapons (given from the console; no models in the demo) and the defender sphere
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/gzweap --demo 'Y,W:1.5,O:give ETF Rifle,O:give Prox Launcher,O:give Plasma Beam,O:give Chainfist,C:16,W:1.5,N:3,W:0.3,H,W:1.5,H,V,C:17,W:1.5,P:30,X,W:3,V,C:18,W:2,N:4,H,W:1,H,V,C:1,W:1.5,B:1,W:1.5,N:3,W:0.3,H,W:1,H,V,O:spawn item_sphere_defender,W:0.2,M:110,O:spawn monster_berserk,W:0.3,O:hurt last 1,W:6,V,Q' > test_output/gzweap.log 2>&1
          L=test_output/gzweap.log
          grep -qE "Gun: weapon 16 .* flechettes ([0-9]|[1-4][0-9]) prox" $L && grep -q "Prox mine stuck" $L && grep -qE "Gun: weapon 18 .* cells ([0-9]|[1-4][0-9]) " $L && grep -q "Gun: weapon 15 " $L && grep -q "Defender sphere fires at" $L && ! grep -q Exception $L || { echo "::error::Ground Zero's weapons misbehaved (see gzweap.log)"; exit 1; }
          # Ground Zero's tesla mine (given from the console): thrown, it opens and zaps a soldier dead
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/gztesla --demo 'O:notarget,W:1.5,G:128 -320 46,O:give Tesla,C:19,W:1.5,O:spawn monster_soldier,X,W:7,V,Q' > test_output/gztesla.log 2>&1
          L=test_output/gztesla.log
          grep -q "Tesla thrown" $L && grep -q "Tesla active" $L && grep -q "Tesla killed Monster[0-9]*_monster_soldier" $L && ! grep -q Exception $L || { echo "::error::Ground Zero's tesla misbehaved (see gztesla.log)"; exit 1; }
          # Ground Zero's Widow (no models in the demo): the first form beams out leaving her legs, the second kills her stalkers and blows up
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo1 test_output/gzboss --demo 'Y,O:notarget,W:1.5,G:128 -320 46,O:spawn monster_widow origin "128 -100 24" angle 270,W:0.3,O:hurt last 5000,W:4.5,V,O:spawn monster_stalker origin "300 -320 24",O:spawn monster_stalker origin "300 -200 24",O:spawn monster_widow2 origin "-60 -100 24" angle 270,W:0.3,O:hurt last 3900,W:5,V,Q' > test_output/gzboss.log 2>&1
          L=test_output/gzboss.log
          grep -q "monster_widow beams out" $L && grep -q "widow_legs" $L && grep -q "monster_widow2 dies: her stalkers with her" $L && grep -q "monster_widow2 blew up" $L && ! grep -q Exception $L || { echo "::error::Ground Zero's Widow misbehaved (see gzboss.log)"; exit 1; }
          # Brush entity texture frames (R_TextureAnimation + EF_ANIM*): demo3's alarm button shows frame 0 until
          # pressed, then cycles frames 2 / 3; the ANIMATED key door cycles all its frames
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest demo3 test_output/btntex --demo "O:notarget,W:1,V,E:lita,W:1.3,V,Q" > test_output/btntex.log 2>&1
