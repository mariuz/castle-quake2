# Native builds (Windows x86_64, Linux x86_64) using the Castle Game Engine
# Docker image, which bundles FPC with cross-compilers and the CGE build tool.
#
# - On every push / pull request: build and keep the packages as workflow artifacts.
# - On a tag like v0.1.0: also attach the packages to a GitHub Release.
#
# See https://castle-engine.io/github_actions and https://castle-engine.io/docker

name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: Package Windows and Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: kambi/castle-engine-cloud-builds-tools:cge-unstable
    steps:
      - uses: actions/checkout@v4

      - name: Show versions
        run: |
          castle-engine --version
          fpc -iV

      - name: Package Windows (x86_64)
        run: castle-engine package --os=win64 --cpu=x86_64 --mode=release --verbose

      - name: Package Linux (x86_64)
        run: castle-engine package --os=linux --cpu=x86_64 --mode=release --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake2-windows
          path: "*-win64-x86_64.zip"
          if-no-files-found: error

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake2-linux
          path: "*-linux-x86_64.tar.gz"
          if-no-files-found: error

  autotest:
    name: Autotest (Linux, Mesa software OpenGL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: kambi/castle-engine-cloud-builds-tools:cge-unstable
    steps:
      - uses: actions/checkout@v4

      - name: Install virtual display and Mesa
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1

      - name: Parser unit tests
        working-directory: tests
        run: |
          castle-engine compile --os=linux --cpu=x86_64 --mode=debug
          ./castle-quake2-tests

      - name: Compile (Linux)
        run: castle-engine compile --os=linux --cpu=x86_64 --mode=release

      - name: Run autotest scripts
        run: |
          set -eu
          mkdir -p test_output
          run_test() {
            map="$1"; demo="$2"
            echo "::group::autotest $map"
            # On Linux the CGE log goes to stdout: capture it next to the screenshots
            status=0
            timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-quake2 --autotest "$map" "test_output/$map" --demo "$demo" > "test_output/$map.log" 2>&1 || status=$?
            tail -n 40 "test_output/$map.log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::autotest $map exited with $status"; exit 1
            fi
            if grep -q "shader not compiled" "test_output/$map.log"; then
              echo "::error::GLSL shader compile error in autotest $map"; exit 1
            fi
            if grep -q "Exception" "test_output/$map.log"; then
              echo "::error::Exception in autotest $map"; exit 1
            fi
          }
          run_test demo1 "W:2,S,K,N:3,C:9,W:0.5,X,W:0.3,S,R:14,C:7,W:0.5,X,W:0.5,S,O:kill,W:3.5,S,Q"
          run_test demo2 "W:2,S,GO:1 0 1,W:1.1,J,W:0.3,S,F,W:0.3,S,F,W:1,Q"
          run_test demo3 "W:2,S,O:lightstyle 6 z,W:0.5,S,O:map demo1,W:1,S,Q"
          ls -l test_output
          test "$(ls test_output/*.png | wc -l)" -ge 9

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-screenshots
          path: test_output/
          if-no-files-found: warn

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: packages
      - name: List packages
        run: ls -l packages
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.zip
            packages/*.tar.gz
          generate_release_notes: true
